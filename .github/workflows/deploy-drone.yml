# 推上 main 時，把網頁檔案用 FTPS 上傳到工作室主機（drone.to24tw.com），做法同 aletheia
name: 部署到 drone.to24tw.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-drone
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只上傳網頁需要的檔案，不上傳 .github、.gitignore 等設定檔
      - name: 整理要上傳的檔案
        run: |
          mkdir -p dist
          cp index.html favicon.svg favicon-32.png apple-touch-icon.png dist/

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTPS (explicit TLS)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" sprx3.coowo.com <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 ./dist/ ./
          bye
          LFTP
