# 推上 main 時，把網頁檔案用 FTP 上傳到工作室主機（drone.to24tw.com）
name: 部署到 drone.to24tw.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只上傳網頁需要的檔案，不上傳 .github、.gitignore 等設定檔
      - name: 整理要上傳的檔案
        run: |
          mkdir -p dist
          cp index.html favicon.svg favicon-32.png apple-touch-icon.png dist/

      - name: FTP 上傳
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
